<html>
    <head><link rel="stylesheet" href="style2.css">
        <title>Formulir Registrasi</title>
    </head>
    <body>
    <div class="form-container">
        <div class="form-header">
          <h2>Registrasi Akun Belajar</h2>
          <p>lengkapi formulir dibawah ini dengan benar.</p>
        </div>
        <form>
            <div class="text">
            <label>Nama lengkap</label>
            <input type="text" id="Nama Lengkaap" placeholder="Masukkan nama lengkap">
            </div>
            <div class="email">
            <label>Alamat Email</label>
            <input type="email" id="email" placeholder="name@contoh.com">
            </div>
            <div class="password">
            <label>Kata Sandi</label>
            <input  type="password" id="Kata Sandi" placeholder="minimal 8 karakter">
            </div>
            <div class="password">
            <label>Konfirmasi Kata Sandi</label>
            <input type="password" id="Konfirmasi Kata Sandi" placeholder="Ulangi Kata Sandi">
            </div>
            <div class="select">
                <label>Status Pengguna</label>
                <select id ="Status Pengguna" placeholder="Pilih Status Pengguna">
                    <option value="pelajar">Pelajar</option>
                    <option value="mahasiswa">Mahasiswa</option>
                    <option value="umum">Umum</option>
                </select>
            </div>
            <div>
                <button type="submit">Daftar</button>
            </div>
        </form>
    </div>  
    </body>
</html>
